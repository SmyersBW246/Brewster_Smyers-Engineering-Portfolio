name: Publish approved portfolio
on:
  workflow_dispatch:
    inputs:
      publication_approved:
        description: 'I approve publishing this portfolio and its contact details'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.publication_approved == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload static site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          build-cmd: npm run check:content && npm run build && npm run verify
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved build
        id: deployment
        uses: actions/deploy-pages@v5
