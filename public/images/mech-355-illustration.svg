<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><rect width="960" height="460" fill="#fafaf8"/><g font-family="Arial,sans-serif" fill="#172d3c"><text x="40" y="48" font-size="28" font-weight="bold">Casting size and cooling-time scaling</text><text x="40" y="80" font-size="18">Illustrative cubes with the same assumed mold/metal constant</text><line x1="210" y1="340" x2="850" y2="340" stroke="#172d3c"/><line x1="210" y1="120" x2="210" y2="340" stroke="#172d3c"/><text x="55" y="155" font-size="18">Model time</text><text x="55" y="180" font-size="18">(minutes)</text><rect x="300" y="286" width="160" height="54" fill="#35647a"/><rect x="590" y="124" width="160" height="216" fill="#b67642"/><g font-size="20" text-anchor="middle"><text x="380" y="273">2.22 min</text><text x="670" y="112">8.89 min</text><text x="380" y="372">20 mm cube</text><text x="670" y="372">40 mm cube</text></g><text x="40" y="414" font-size="18">Double linear size → double V/A → four times the model solidification time.</text><text x="40" y="443" font-size="16">Assumed Cm = 0.20 min/mm²; all six faces cool. Not a student experiment or process qualification.</text></g></svg>